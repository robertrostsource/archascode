risks:
  - {id: RSK-01, statement: "A stolen contractor session exposes confidential ERP or engineering data", threatens: [VAL-02], domain: AEF-LOC-0004, likelihood: Medium, impact: High, treatment: Mitigate, domas_at_risk: [DOMA-01, DOMA-04], needs_security_input: true}
  - {id: RSK-02, statement: "An access-broker outage stops remote work for all users", threatens: [VAL-01], domain: AEF-LOC-0002, likelihood: Low, impact: High, treatment: Mitigate, domas_at_risk: [DOMA-03]}
  - {id: RSK-03, statement: "Migration slips past VPN end of support", threatens: [VAL-03], domain: AEF-LOC-0018, likelihood: Medium, impact: Medium, treatment: Mitigate, domas_at_risk: [DOMA-05]}

decisions:
  - {id: DEC-01, question: "Is the cloud access-broker provider really outside Suppliers? It will carry every remote session.", owner: Director of Infrastructure, status: Open, related: [AEF-LOC-0038]}
  - {id: DEC-02, question: "Do joiner, mover, leaver and access-request processes change? Processes is marked not impacted.", owner: IAM owner, status: Open, related: [AEF-LOC-0005]}
  - {id: DEC-03, question: "Do session and access logs create new data stores with retention needs? Data is marked not impacted.", owner: Security Operations, status: Open, related: [AEF-LOC-0019]}

sda_trigger:
  recommended: true
  reasons: [high_value_at_risk]
  notes: "RSK-01 is High impact against a MUST outcome. Three domains are marked not impacted without a human decision."

