  - {domain: AEF-LOC-0020, impact: medium}
  - {domain: AEF-LOC-0021, impact: none, confirmed_empty: true}
  - {domain: AEF-LOC-0031, impact: medium}
  - {domain: AEF-LOC-0036, impact: none, confirmed_empty: true}
  - domain: AEF-LOC-0037
    impact: low
    elements:
