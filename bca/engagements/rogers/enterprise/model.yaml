risks:
  - {id: RSK-01, rank: 1, statement: "Theft or disclosure of formulations and process know-how erodes competitive advantage", threatens: [VAL-02], domain: AEF-LOC-0003, elements: [Trade secrets and process know-how], likelihood: Medium, impact: High, treatment: Mitigate, strategies: [STR-01], needs_security_input: true}
  - {id: RSK-02, rank: 2, statement: "Cyberattack or failure stops ERP, order processing, and shipping", threatens: [VAL-01], domain: AEF-LOC-0016, elements: [Legacy ERP, Order processing and inventory systems], likelihood: Medium, impact: High, treatment: Mitigate, strategies: [STR-02, STR-03], needs_security_input: true}
  - {id: RSK-03, rank: 3, statement: "The ERP transition weakens financial reporting controls", threatens: [VAL-01], domain: AEF-LOC-0005, elements: ["Financial reporting (ICFR)"], likelihood: Medium, impact: High, treatment: Mitigate, strategies: [STR-04]}
  - {id: RSK-04, rank: 4, statement: "Failure or compromise of a sole-source supplier halts production", threatens: [VAL-01], domain: AEF-LOC-0038, elements: [Sole or limited-source raw material suppliers], likelihood: Medium, impact: High, treatment: Mitigate, strategies: [STR-05]}
  - {id: RSK-05, rank: 5, statement: "A disaster or geopolitical event takes a key plant offline", threatens: [VAL-01], domain: AEF-LOC-0007, elements: ["Suzhou, China", "Eschenbach, Germany"], likelihood: Low, impact: High, treatment: Mitigate, strategies: [STR-06]}
  - {id: RSK-06, rank: 6, statement: "Export controls or sanctions are breached, restricting access to markets", threatens: [VAL-01], domain: AEF-LOC-0006, elements: ["Circuit materials (RO4000, RT/duroid)"], likelihood: Medium, impact: High, treatment: Mitigate, strategies: [STR-07]}
  - {id: RSK-07, rank: 7, statement: "A breach of customer design data damages trust and future design wins", threatens: [VAL-01, VAL-02], domain: AEF-LOC-0036, elements: ["~2,800 OEMs and component suppliers"], likelihood: Medium, impact: Medium, treatment: Mitigate, strategies: [STR-01, STR-03]}
  - {id: RSK-08, rank: 8, statement: "Losing key sales and R&D engineers takes critical know-how with them", threatens: [VAL-02], domain: AEF-LOC-0004, elements: [Sales engineers, R&D and Innovation Center engineers], likelihood: Medium, impact: Medium, treatment: Mitigate, strategies: [STR-08]}
  - {id: RSK-09, rank: 9, statement: "A third-party IT provider is compromised and used to reach Rogers systems", threatens: [VAL-01], domain: AEF-LOC-0037, elements: [Third-party IT service providers], likelihood: Medium, impact: Medium, treatment: Mitigate, strategies: [STR-05, STR-03]}
  - {id: RSK-10, rank: 10, statement: "Personal data is processed in breach of GDPR, CCPA, or national privacy laws", threatens: [VAL-01], domain: AEF-LOC-0019, elements: [Confidential design and customer data stores], likelihood: Low, impact: Medium, treatment: Mitigate, strategies: [STR-09]}

strategies:
  - {id: STR-01, library_ref: STR-IP-PROTECTION, name: Protect proprietary information, statement: "Classify formulations, designs, and customer data, and restrict, monitor, and govern their use.", mitigates: [RSK-01, RSK-07], domains: [AEF-LOC-0003, AEF-LOC-0019, AEF-LOC-0004], attributes: [Confidential, Classified, Access-Controlled, Duty-Segregated, Aware, Governed, Monitored]}
  - {id: STR-02, library_ref: STR-OPS-CONTINUITY, name: Keep critical operations running, statement: "Sustain ERP, order, and shipping systems through incidents and change.", mitigates: [RSK-02], domains: [AEF-LOC-0016, AEF-LOC-0017, AEF-LOC-0005], attributes: [Available, Recoverable, Change-Managed, Configuration-Managed, Vulnerability-Managed]}
  - {id: STR-03, library_ref: STR-THREAT-DETECTION, name: Detect and respond to threats, statement: "Monitor for intrusions across systems and third-party connections, and respond fast enough to limit harm.", mitigates: [RSK-02, RSK-07, RSK-09], domains: [AEF-LOC-0015, AEF-LOC-0042], attributes: [Threat-Managed, Monitored, Incident-Managed, Reported]}
  - {id: STR-04, library_ref: STR-GOVERNED-CHANGE, name: Transform the ERP under control, statement: "Run the ERP program with owned milestones and preserved financial controls.", mitigates: [RSK-03], domains: [AEF-LOC-0016, AEF-LOC-0005, AEF-LOC-0019], attributes: [Change-Managed, Integrity-Assured, Auditable, Duty-Segregated, Owned]}
  - {id: STR-05, library_ref: STR-THIRD-PARTY-ASSURANCE, name: Assure suppliers and partners, statement: "Vet, contract, and monitor sole-source suppliers and IT providers in proportion to the value they affect.", mitigates: [RSK-04, RSK-09], domains: [AEF-LOC-0038, AEF-LOC-0037], attributes: [Vetted, Monitored, Risk-Managed, Assured, Available]}
  - {id: STR-06, library_ref: STR-SITE-RESILIENCE, name: Prepare plants for crises, statement: "Plan, exercise, and recover plant operations after disasters and geopolitical disruption.", mitigates: [RSK-05], domains: [AEF-LOC-0007], attributes: [Crisis-Managed, Emergency-Managed, Recoverable, Safe]}
  - {id: STR-07, library_ref: STR-HARMONIZED-COMPLIANCE, name: Harmonize trade and regulatory obligations, statement: "Map export, sanctions, and securities obligations to one control framework with clear ownership.", mitigates: [RSK-06], domains: [AEF-LOC-0006, AEF-LOC-0001], attributes: [Compliant, Legal, Auditable, Owned, Governed]}
  - {id: STR-08, library_ref: STR-KNOWLEDGE-RETENTION, name: Retain critical expertise, statement: "Document and share the knowledge of sales and R&D engineers.", mitigates: [RSK-08], domains: [AEF-LOC-0004], attributes: [Documented, Experienced, Resourced]}
  - {id: STR-09, library_ref: STR-PRIVACY-BY-DESIGN, name: Build privacy into processing, statement: "Collect, use, and retain personal data only as each jurisdiction permits.", mitigates: [RSK-10], domains: [AEF-LOC-0019], attributes: [Confidential, Classified, Compliant, Legal]}

decisions:
  - {id: DEC-01, question: "Does protecting proprietary technology outrank operational availability where the two conflict?", owner: Needs Validation (executive sponsor), status: Open, adr_needed: true, related: [BRO2, BRO3]}
  - {id: DEC-02, question: "Is Partners correctly rated low impact, or are outsourced services in scope?", owner: Needs Validation, status: Open, related: [AEF-LOC-0037]}

sda_trigger:
