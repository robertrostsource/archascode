  - {id: RSK-02, statement: Cyber or system disruption halts order processing and shipping, threatens: [VAL-01], domain: AEF-LOC-0016, likelihood: Medium, impact: High, treatment: Mitigate, domas_at_risk: [DOMA-04], needs_security_input: true}
