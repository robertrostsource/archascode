# Illustrative enterprise-mode BCA built only from public sources
# (Rogers Corporation FY2025 Form 10-K). Not endorsed by Rogers Corporation.
# Serves as the golden test for the BCA agent and the renderers.

metadata:
  id: BCA-ROGERS-ENT
  title: Rogers Corporation - Enterprise Business Context (public-source illustration)
  mode: enterprise
  status: Draft
  classification: Internal Use Only
  customer: Illustration only
  author: archascode BCA agent
  date: "2026-09-25"
  collaborators:
    - {name: Maintainer, role: Security Architect, contribution: Domain classification review}

value:
  - {id: VAL-01, domain: AEF-LOC-0040, statement: Profitable growth in targeted engineered-materials markets, measure: Net sales growth and gross margin}
  - {id: VAL-02, domain: AEF-LOC-0040, statement: Competitive advantage from proprietary materials technology}
  - {id: VAL-03, domain: AEF-LOC-0041, statement: Safe workplaces and responsible environmental impact}

problem:
  statement: Growth and margin depend on protecting proprietary technology and keeping globally distributed operations running amid supply, trade, and cyber pressure.
  current_state: Sales declined modestly in 2025; restructuring and a multi-year ERP replacement are underway; IT is reported as under constant attack.
  desired_state: Secure, resilient operations that let the market-driven strategy and innovation pillar deliver profitable growth.
  value_at_stake: [VAL-01, VAL-02]

business_outcomes:
  - {id: BRO1, name: Grow revenue in target markets, description: "Win and expand business in EV/HEV, ADAS, aerospace and defense, and renewable energy markets.", necessity: MUST, creates_value: [VAL-01], domains: [AEF-LOC-0006, AEF-LOC-0036], library_ref: BO-GROW-MARKETS, evidence: [{source: "10-K Item 7", reference: Company Overview and Strategy}], domas: [DOMA-01]}
  - {id: BRO2, name: Protect proprietary technology, description: "Preserve the advantage created by R&D, trade secrets, and process know-how.", necessity: MUST, creates_value: [VAL-02, VAL-01], domains: [AEF-LOC-0003, AEF-LOC-0019], library_ref: BO-INNOVATION-IP, evidence: [{source: "10-K Item 1A", reference: Proprietary technology risk}], domas: [DOMA-02, DOMA-03]}
  - {id: BRO3, name: Keep operations running through disruption, description: "Continue to produce, ship, and transact when sites or systems are disrupted.", necessity: MUST, creates_value: [VAL-01], domains: [AEF-LOC-0007, AEF-LOC-0016, AEF-LOC-0017], library_ref: BO-OPERATIONAL-RESILIENCE, evidence: [{source: "10-K Item 1A", reference: Facilities and IT disruption}], domas: [DOMA-04, DOMA-05]}
  - {id: BRO4, name: Assure continuity of critical supply, description: "Sustain production despite sole or limited-source raw materials.", necessity: MUST, creates_value: [VAL-01], domains: [AEF-LOC-0038, AEF-LOC-0005], library_ref: BO-SUPPLY-CONTINUITY, evidence: [{source: "10-K Item 1A", reference: Supplier dependence}], domas: [DOMA-06]}
  - {id: BRO5, name: Retain access to global markets, description: "Keep selling and operating across jurisdictions despite tariffs and export controls.", necessity: MUST, creates_value: [VAL-01], domains: [AEF-LOC-0006, AEF-LOC-0005], library_ref: BO-GLOBAL-MARKET-ACCESS, evidence: [{source: "10-K Item 1A", reference: International operations; U.S.-China trade}], domas: [DOMA-07]}
  - {id: BRO6, name: Produce reliable financial records through ERP change, description: "Keep financial reporting accurate during the ERP replacement.", necessity: MUST, creates_value: [VAL-01], domains: [AEF-LOC-0016, AEF-LOC-0019], library_ref: BO-TRUSTED-REPORTING, evidence: [{source: "10-K Item 1A", reference: ERP implementation}], domas: [DOMA-08]}
  - {id: BRO7, name: Everyone goes home safely, description: "Protect employee health and safety at every site.", necessity: MUST, creates_value: [VAL-03], domains: [AEF-LOC-0004, AEF-LOC-0007], library_ref: BO-SAFE-WORKPLACE, evidence: [{source: "10-K Item 1", reference: Human Capital}], domas: [DOMA-09]}

