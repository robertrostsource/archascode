version: 0.1.0
source: agile-security-system/baseline-perspectives
perspectives: [enterprise, service, value_stream, external]

domains:

  # --- Boundary --------------------------------------------------------------
  - id: AEF-LOC-0001
    name: Enterprise Domain
    type: boundary
    parent: null
    description: >
      The organization's boundary. Elements the organization controls sit
      inside; everything else sits outside. Requirements captured here come
      from the highest available authority and are tested for whether they
      are wishes, goals, or objectives.

  # --- Value (anchor for every BCA) -------------------------------------------
  - id: AEF-LOC-0039
    name: Business Value
    type: logical
    parent: AEF-LOC-0001
    description: >
      What the organization's customers and stakeholders value. Split into
      financial value and social impact; the balance differs for commercial,
      non-profit, and public sector organizations.

  - id: AEF-LOC-0040
    name: Financial Value
    type: logical
    parent: AEF-LOC-0039
    description: >
      Financial measures of value, such as revenue, market share, solvency,
      and goodwill. Created mainly through products, services, and
      information.

  - id: AEF-LOC-0041
    name: Social Impact
    type: logical
    parent: AEF-LOC-0039
    description: >
      Measurable effect the organization has on communities and society.
      Created mainly through products and services; intentionally not
      linked directly to information.

  # --- Offerings and information -----------------------------------------------
  - id: AEF-LOC-0006
    name: Products
    type: physical
    parent: AEF-LOC-0001
    description: >
      Physical products the organization makes. Products create business
      value, may package information, and are designed and built by people.

  - id: AEF-LOC-0002
    name: Services
    type: logical
    parent: AEF-LOC-0001
    description: >
      Every service the organization provides, whether internal, external,
      technical, or human-delivered. Services expose and act on information
      and create business value.

  - id: AEF-LOC-0003
    name: Information
    type: logical
    parent: AEF-LOC-0001
    description: >
      All information the organization creates, consumes, or manages.
      Represented physically or electronically by elements of the Data
      domain; may carry intrinsic financial value.

  # --- Delivery -----------------------------------------------------------------
  - id: AEF-LOC-0004
    name: People
    type: physical
    parent: AEF-LOC-0001
    description: >
      Employees, contractors, and part-time staff acting on the
      organization's behalf.

  - id: AEF-LOC-0005
    name: Processes
    type: physical
    parent: AEF-LOC-0001
    description: >
      How day-to-day work gets done, documented or not. Processes structure
      services and may be automated by applications.

  - id: AEF-LOC-0007
    name: Facilities
    type: physical
    parent: AEF-LOC-0001
    description: >
      Any facility used in operations, owned or not. Facilities contain
      people, platforms, and networks, and host information.
    needs_validation: >
      Appendix G of the source lists Facilities as AEF-LOC-0006, which
      collides with Products. The perspective diagrams use AEF-LOC-0007.
      Confirm with Archistry.

  # --- Information Technology ----------------------------------------------------
  - id: AEF-LOC-0015
    name: Information Technology
    type: physical
    parent: AEF-LOC-0001
    description: >
      Technology that delivers IT capability to the organization, regardless
      of ownership or location. Decomposes into applications, platforms,
      networks, and data.

  - id: AEF-LOC-0016
    name: Applications
    type: physical
    parent: AEF-LOC-0015
    description: >
      Every application used in operations. Applications support processes,
      transform data, and run on platforms.

  - id: AEF-LOC-0017
    name: Platforms
    type: physical
    parent: AEF-LOC-0015
    description: >
      Hardware plus operating software capable of running applications,
      including virtualized and cloud environments ("the OS down").

  - id: AEF-LOC-0018
    name: Network
    type: physical
    parent: AEF-LOC-0015
    description: >
      Devices and appliances that connect platforms and move data. Excludes
      storage networks (see Data).

  - id: AEF-LOC-0019
    name: Data
    type: physical
    parent: AEF-LOC-0015
    description: >
      Physical and electronic media and repositories that hold information,
      from databases and file shares to removable media and paper records.

  # --- External Perspective --------------------------------------------------------
  - id: AEF-LOC-0042
    name: Public Internet
    type: physical
    parent: null
    description: >
      Global connectivity linking the enterprise network to external parties,
      regardless of provider.

  - id: AEF-LOC-0020
    name: External Parties
    type: physical
    parent: null
    description: >
      Everyone outside the enterprise boundary not captured elsewhere.
      Decompose only as far as the architecture needs.

  - id: AEF-LOC-0021
    name: Public
    type: physical
    parent: AEF-LOC-0020
    description: >
      The general public: neither trusted nor hostile until an interaction
      places them in a more specific domain.

  - id: AEF-LOC-0031
    name: Trusted Parties
    type: physical
    parent: AEF-LOC-0020
    description: >
      External parties with a legitimate business relationship that
      establishes trust and security requirements for interactions.

  - id: AEF-LOC-0036
    name: Customers
    type: physical
    parent: AEF-LOC-0031
    description: Parties who acquire the organization's products or services, paid or free.

  - id: AEF-LOC-0037
    name: Partners
    type: physical
    parent: AEF-LOC-0031
    description: >
      Parties invested in the organization's success, typically providing
      non-commodity outsourced services.

  - id: AEF-LOC-0038
    name: Suppliers
    type: physical
    parent: AEF-LOC-0031
    description: >
      Parties providing commodity products or services on standard terms,
      including vendor-managed updates.

  - id: AEF-LOC-0026
    name: Hostile Entities
    type: physical
    parent: AEF-LOC-0020
    description: >
      Anyone intending harm. Usually exploits the legitimate interactions of
      other external parties. The intent of an interaction, not the actor,
      determines placement.

# ---------------------------------------------------------------------------
# RELATIONSHIPS (provider -> consumer), from the Baseline Perspectives.
# The BCA agent uses these to trace value and to flag missing domains.
# ---------------------------------------------------------------------------
relationships:
  # Value creation
  - {from: AEF-LOC-0006, verb: create,    to: AEF-LOC-0039}
  - {from: AEF-LOC-0002, verb: create,    to: AEF-LOC-0039}
  - {from: AEF-LOC-0003, verb: has,       to: AEF-LOC-0040}
  - {from: AEF-LOC-0007, verb: has,       to: AEF-LOC-0040}
  # Offerings and information
  - {from: AEF-LOC-0006, verb: package,   to: AEF-LOC-0003}
  - {from: AEF-LOC-0002, verb: expose,    to: AEF-LOC-0003}
  - {from: AEF-LOC-0019, verb: represent, to: AEF-LOC-0003}
  # People
  - {from: AEF-LOC-0004, verb: build,     to: AEF-LOC-0006}
  - {from: AEF-LOC-0004, verb: deliver,   to: AEF-LOC-0002}
  - {from: AEF-LOC-0004, verb: manage,    to: AEF-LOC-0003}
  - {from: AEF-LOC-0004, verb: execute,   to: AEF-LOC-0005}
  - {from: AEF-LOC-0004, verb: manage,    to: AEF-LOC-0007}
  - {from: AEF-LOC-0004, verb: manage,    to: AEF-LOC-0015}
  - {from: AEF-LOC-0004, verb: structure, to: AEF-LOC-0019}
  - {from: AEF-LOC-0004, verb: use,       to: AEF-LOC-0017}
  # Process and technology
  - {from: AEF-LOC-0005, verb: structure, to: AEF-LOC-0002}
  - {from: AEF-LOC-0016, verb: support,   to: AEF-LOC-0005}
  - {from: AEF-LOC-0002, verb: request,   to: AEF-LOC-0016}
  - {from: AEF-LOC-0016, verb: transform, to: AEF-LOC-0019}
  - {from: AEF-LOC-0017, verb: host,      to: AEF-LOC-0016}
  - {from: AEF-LOC-0017, verb: host,      to: AEF-LOC-0019}
  - {from: AEF-LOC-0018, verb: connect,   to: AEF-LOC-0017}
  - {from: AEF-LOC-0018, verb: transfer,  to: AEF-LOC-0019}
  # Facilities
  - {from: AEF-LOC-0007, verb: contain,   to: AEF-LOC-0004}
  - {from: AEF-LOC-0007, verb: contain,   to: AEF-LOC-0017}
  - {from: AEF-LOC-0007, verb: contain,   to: AEF-LOC-0018}
  - {from: AEF-LOC-0007, verb: host,      to: AEF-LOC-0003}
  # External
  - {from: AEF-LOC-0042, verb: connect,   to: AEF-LOC-0018}
  - {from: AEF-LOC-0036, verb: buy,       to: AEF-LOC-0006}
  - {from: AEF-LOC-0036, verb: buy,       to: AEF-LOC-0002}
  - {from: AEF-LOC-0037, verb: manage,    to: AEF-LOC-0002}
  - {from: AEF-LOC-0037, verb: manage,    to: AEF-LOC-0015}
  - {from: AEF-LOC-0038, verb: provide,   to: AEF-LOC-0015}
  - {from: AEF-LOC-0038, verb: provide,   to: AEF-LOC-0007}

# ---------------------------------------------------------------------------
# WORKSHEET LAYOUT (used by scripts/render_domain_impact.py)
# Rows are stacked top to bottom with invisible links so the Mermaid
# worksheet reads like the original: value on top, delivery in the middle,
# technology below the enterprise, external parties at the bottom.
# ---------------------------------------------------------------------------
worksheet_layout:
  - [AEF-LOC-0039]
  - [AEF-LOC-0006, AEF-LOC-0002, AEF-LOC-0003]
  - [AEF-LOC-0004, AEF-LOC-0005, AEF-LOC-0007]
  - [AEF-LOC-0015]
  - [AEF-LOC-0001]
  - [AEF-LOC-0042]
  - [AEF-LOC-0020]

# ---------------------------------------------------------------------------
# EXTRACTION GUIDE (used by the BCA agent, Step 5)
# For each domain: which elements to pull from the inputs, in the
# organization's own words, and where they usually appear. 10-K locations
# apply in enterprise mode; intake locations apply in solution mode.
# Container domains (Enterprise, Business Value, IT, External and Trusted
# Parties) are populated through their subdomains.
# ---------------------------------------------------------------------------
extract_from:
  AEF-LOC-0040:  # Financial Value
    look_for: Revenue lines, margins, market positions, growth markets, cost targets, audit or financial exposures
    tenk: [Item 7 MD&A executive summary, Item 1 segments and markets]
    intake: [Business case, cost avoidance, audit findings, contract or license end dates]
  AEF-LOC-0041:  # Social Impact
    look_for: Safety commitments, environmental obligations, community or workforce commitments
    tenk: [Item 1 Human Capital, Item 1A environmental and climate risks]
    intake: [ESG or safety requirements named by the business]
  AEF-LOC-0006:  # Products
    look_for: Physical product lines, brands, and trade names
    tenk: [Item 1 segments and trade names]
    intake: [Products the solution supports or changes]
  AEF-LOC-0002:  # Services
    look_for: Services delivered to customers or employees, including technical support and internal IT services
    tenk: [Item 1 sales approach and customer support, Item 7 strategy]
    intake: [The service being built or changed, its tier and SLA]
  AEF-LOC-0003:  # Information
    look_for: Categories of information of value - trade secrets, designs, customer data, personal data, financial records
    tenk: [Item 1 patents and IP, Item 1A IT breach and data protection, Item 1C]
    intake: [Data classification, information the solution exposes or processes]
  AEF-LOC-0004:  # People
    look_for: Workforce groups and roles - engineers, sales, manufacturing, contractors, executives, operations teams
    tenk: [Item 1 Human Capital, Item 1A key personnel, Executive officers]
    intake: [User populations and counts, support and operations teams]
  AEF-LOC-0005:  # Processes
    look_for: Core business processes - manufacturing, procurement, order-to-cash, R&D, financial reporting, access requests
    tenk: [Item 1 manufacturing and raw materials, Item 1A IT disruption and ERP, Item 9A]
    intake: [Workflows the solution changes - joiner/mover/leaver, approvals, support]
  AEF-LOC-0007:  # Facilities
    look_for: Sites - headquarters, plants, R&D or innovation centers, warehouses, data centers, by country
    tenk: [Item 2 Properties, Item 1 segment facilities]
    intake: [Locations where users, systems, or data reside]
  AEF-LOC-0016:  # Applications
    look_for: Named business systems - ERP, order processing, inventory, identity provider, portals
    tenk: [Item 1A IT disruption and ERP implementation]
    intake: [Applications in scope, integrations]
  AEF-LOC-0017:  # Platforms
    look_for: Devices, servers, cloud tenancies, hosted environments
    tenk: [Item 1A IT breach (mobile devices, third-party providers), Item 1C]
    intake: [Endpoint types, managed vs personal devices, cloud services]
  AEF-LOC-0018:  # Network
    look_for: Connectivity - site-to-site links, remote access, telecommunications, boundary devices
    tenk: [Item 1A IT disruption (telecommunication failures), Item 1C network protections]
    intake: [VPN, brokers, segments, subnets]
  AEF-LOC-0019:  # Data
    look_for: Data stores and records - financial records, databases, logs, backups, paper records
    tenk: [Item 1A IT breach, Item 9A controls]
    intake: [Where data is stored, logged, retained]
  AEF-LOC-0042:  # Public Internet
    look_for: Internet-facing business activity - e-commerce, remote work, customer portals
    tenk: [Item 1A IT breach (Internet and telecommunications)]
    intake: [Internet-facing components]
  AEF-LOC-0036:  # Customers
    look_for: Customer types, count, concentration, channels
    tenk: [Item 1 Sales and Competition]
    intake: [External users or customers affected]
  AEF-LOC-0037:  # Partners
    look_for: Outsourced, non-commodity service providers, JVs, consultants, contract firms
    tenk: [Item 1A IT breach (third-party service providers), Item 1A ERP (consultants)]
    intake: [Managed service providers, contract firms]
  AEF-LOC-0038:  # Suppliers
    look_for: Commodity or sole-source suppliers of materials, technology, and cloud services
    tenk: [Item 1 raw materials, Item 1A supplier dependence]
    intake: [Vendors and SaaS providers the solution depends on]
  AEF-LOC-0026:  # Hostile Entities
    look_for: Threat actors the organization itself names - hackers, nation states, insiders, IP thieves
    tenk: [Item 1A IT breach and IP protection]
    intake: [Threats named in the request or threat intelligence]
  AEF-LOC-0021:  # Public
    look_for: General public interactions, if any
    tenk: []
    intake: []
