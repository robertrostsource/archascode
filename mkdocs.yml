site_name: Architecture as Code
site_description: AI-assisted cybersecurity architecture artifacts - Business Contextual Architecture, SBARs, ADRs and design documents
site_url: https://robertrostsource.github.io/archascode/
repo_url: https://github.com/robertrostsource/archascode
repo_name: robertrostsource/archascode
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.action.edit

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

# No "nav:" section on purpose. MkDocs builds the menu from the docs/ folder,
# so a new SBAR or BCA appears on the site as soon as its file lands in docs/.
